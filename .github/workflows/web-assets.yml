name: web-assets

# The embedded console lives in internal/admin/webdist and is committed, so a
# machine without a working Node toolchain cannot finish a console change. This
# workflow rebuilds the assets and uploads them as an artifact that can be
# downloaded and committed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: webdist
          path: internal/admin/webdist
          if-no-files-found: error
